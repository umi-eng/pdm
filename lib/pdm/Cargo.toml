[package]
name = "umi-pdm"
description = "Rust library for interfacing with UMI power distribution modules"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/umi-eng/pdm"
license = "MPL-2.0"

[dependencies]
embedded-can.workspace = true
saelient = { workspace = true, features = ["std"] }
log.workspace = true
umi-pdm-messages.workspace = true
socketcan.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["pdm20", "pdm36"]

pdm20 = []
pdm36 = []
