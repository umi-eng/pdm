[package]
name = "umi-pdm-messages"
description = "CAN message definitions for UMI power distribution modules"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/umi-eng/pdm"
license = "MPL-2.0"

[dependencies]
bitvec.workspace = true
defmt = { workspace = true, optional = true }
embedded-can.workspace = true
saelient.workspace = true

[build-dependencies]
dbc-codegen.workspace = true

[features]
default = ["pdm20", "pdm36"]

pdm20 = []
pdm36 = []

defmt = ["dep:defmt"]
